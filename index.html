<head>

<title>Halloween • Gincana</title>
<style>
:root{--bg:#100b18;--panel:#1b1227;--panel2:#241535;--purple:#8b45d6;--purple2:#b878ff;--orange:#ff8a24;--text:#fff8ff;--muted:#bbaacb;--line:#39264b;--green:#67e6ad;--red:#ff6c80}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,#3a1754 0,transparent 28%),radial-gradient(circle at 10% 75%,#30172f 0,transparent 24%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--purple);color:white;font-weight:750;transition:.15s}button:hover{filter:brightness(1.13);transform:translateY(-1px)}button.secondary{background:#352343;border:1px solid #54396b}button.orange{background:var(--orange);color:#24102d}button.danger{background:#612538}button.small{padding:7px 10px;font-size:12px;border-radius:9px}button:disabled{opacity:.4;cursor:not-allowed;transform:none}
input,select,textarea{background:#110c19;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}input[type=file]{padding:7px;font-size:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(25px,4vw,38px);margin-bottom:8px;letter-spacing:-1px}h2{font-size:22px}h3{font-size:16px}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.accent{color:var(--orange)}.app{max-width:1500px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,var(--purple),#442060);box-shadow:0 8px 25px #0005}.brand-title{font-weight:900;letter-spacing:1.5px}.brand-sub{font-size:11px;color:var(--muted);letter-spacing:2px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.nav button{background:#20152c;color:var(--muted);border:1px solid var(--line)}.nav button.active{background:var(--purple);color:white;border-color:var(--purple)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.main,.side,.card{background:linear-gradient(145deg,#21152e,#181020);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 40px #0002}.side{position:sticky;top:12px}.hero{padding:28px;background:linear-gradient(120deg,#31164b,#1d1229 70%);border:1px solid #563471;border-radius:22px;position:relative;overflow:hidden;margin-bottom:18px}.hero:after{content:"👻";position:absolute;right:28px;top:8px;font-size:clamp(65px,10vw,115px);filter:drop-shadow(0 10px 14px #0005);opacity:.95;transform:rotate(9deg)}.hero p{max-width:650px;color:#d9c8e8;margin-bottom:0;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.stat{background:#170f21;border:1px solid var(--line);padding:16px;border-radius:16px}.stat strong{display:block;font-size:27px;color:var(--orange)}.stat span{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.fieldrow{display:flex;gap:9px;align-items:end}.fieldrow>*{flex:1}.participant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.person{border:1px solid var(--line);border-radius:14px;background:#160f20;padding:10px;text-align:center;position:relative;min-width:0}.person img,.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:grid;place-items:center;background:linear-gradient(140deg,#7b3db5,#ff8a24);font-size:27px;border:2px solid #70438d}.person .name{font-weight:800;font-size:13px;overflow-wrap:anywhere}.person .points{font-size:12px;color:var(--orange);margin-top:5px}.person.selected{border:2px solid var(--orange);background:#33203d;box-shadow:0 0 0 2px #ff8a2422}.person input[type=checkbox]{width:auto;position:absolute;top:8px;left:8px;accent-color:var(--orange)}.person-actions{display:flex;justify-content:center;gap:5px;margin-top:8px}.pill{display:inline-block;border:1px solid #5a3a70;background:#2a1b38;border-radius:99px;padding:5px 9px;font-size:11px;color:#e7d7f7}.activity-card{display:flex;gap:14px;align-items:center;padding:15px;border:1px solid var(--line);background:#170f21;border-radius:15px}.activity-icon{font-size:32px;width:52px;height:52px;border-radius:15px;background:#342044;display:grid;place-items:center;flex-shrink:0}.activity-card p{margin:4px 0 0;font-size:12px;color:var(--muted)}.activity-card .grow{flex:1}.instruction{background:#160f20;border:1px solid var(--line);border-radius:14px;padding:16px;line-height:1.65}.instruction li{margin-bottom:6px}.question{font-size:clamp(20px,3vw,29px);line-height:1.35;font-weight:850;margin:20px 0}.answer{background:#19372f;border:1px solid #2b7658;padding:13px;border-radius:12px;color:#c9ffe8;margin:12px 0}.scoreboard{display:grid;gap:10px}.score-team{background:#170f21;border:1px solid var(--line);border-radius:14px;padding:14px}.score-team strong{font-size:14px}.score-team .bigscore{font-size:26px;font-weight:900;color:var(--orange);float:right}.score-team .members{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.mini-avatar{width:29px;height:29px;border-radius:50%;object-fit:cover;background:#4a2b61;border:1px solid #8053a2}.score-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.ranking-row{display:grid;grid-template-columns:35px 42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line)}.ranknum{font-weight:900;color:var(--orange);font-size:18px}.rankimg{width:40px;height:40px;object-fit:cover;border-radius:50%;background:#44235e}.rankname{font-weight:800}.rankdetail{font-size:11px;color:var(--muted);margin-top:3px}.rankpoints{font-size:19px;font-weight:900;color:var(--orange)}.roundbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.roundbar .pill{margin-right:auto}.hidden{display:none!important}.notice{padding:12px;border:1px solid #65457a;border-radius:12px;background:#261734;color:#ddc9f0;font-size:13px;line-height:1.5}.warning{border-color:#8b5d29;background:#302116;color:#ffe1b6}.success{border-color:#2b7658;background:#19372f;color:#c9ffe8}.emoji-question{font-size:clamp(45px,8vw,75px);text-align:center;letter-spacing:5px;margin:25px 0}.vote-preview{background:#fff;color:#21152c;border-radius:18px;padding:18px}.vote-preview h3{color:#411f5e}.vote-person{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid #e5dce9;padding:12px 0}.vote-person label{color:#4b3d54}.vote-person input{background:white;color:#21152c;border-color:#d9cde1}.footer{font-size:11px;color:var(--muted);text-align:center;padding:22px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f4eaff;color:#24102d;padding:12px 18px;border-radius:12px;font-weight:800;z-index:50;box-shadow:0 10px 40px #0007}.modal-back{position:fixed;inset:0;background:#08040dc9;z-index:40;display:grid;place-items:center;padding:20px}.modal{max-width:560px;width:100%;background:#20142c;border:1px solid #63437a;border-radius:20px;padding:22px;max-height:90vh;overflow:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.hero:after{opacity:.25}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.main,.side{padding:16px}}
.main:fullscreen{background:#100b18;color:#fff8ff;width:100vw;height:100vh;max-width:none;overflow:auto;padding:clamp(20px,5vw,70px);border:0;border-radius:0;display:block}.main:fullscreen .round-area{margin-top:18px!important}.main:fullscreen .question{font-size:clamp(30px,4.5vw,60px)}.main:fullscreen .emoji-question{font-size:clamp(70px,12vw,150px)}.main:fullscreen .round-area{background:transparent;border:0}.round-area:fullscreen{background:#100b18;color:#fff8ff;width:100vw;height:100vh;overflow:auto;padding:clamp(20px,5vw,70px);border:0;border-radius:0;display:flex;flex-direction:column;justify-content:center}.round-area:fullscreen .question{font-size:clamp(34px,5vw,68px);line-height:1.2;margin:28px 0}.round-area:fullscreen .emoji-question{font-size:clamp(80px,14vw,170px)}.round-area:fullscreen .roundbar .pill{font-size:16px;padding:9px 14px}.round-area:fullscreen .answer,.round-area:fullscreen .instruction{font-size:clamp(18px,2vw,26px)}.round-area:fullscreen button{font-size:clamp(15px,1.5vw,22px);padding:12px 18px}.round-area:fullscreen img{max-height:38vh!important;object-fit:contain}.round-area:fullscreen .fullscreen-exit{display:inline-flex!important;align-self:flex-end;margin-bottom:14px}
.costume-slide:fullscreen{width:100vw;height:100vh;max-width:none;overflow:auto;border-radius:0;align-content:center;padding:5vw}.costume-slide:fullscreen img{max-height:80vh!important}@media(max-width:560px){.costume-slide{grid-template-columns:1fr!important;text-align:center}.app{padding:10px}.topbar{align-items:flex-start}.brand-sub{letter-spacing:1px}.grid2,.grid3{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:21px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:12px;padding:9px}.fieldrow{flex-direction:column;align-items:stretch}.ranking-row{grid-template-columns:26px 36px minmax(0,1fr) auto;gap:7px}.rankimg{width:34px;height:34px}.hero{padding:20px}.hero:after{right:10px;top:20px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">👻</div><div><div class="brand-title">NOITE DO TERROR</div><div class="brand-sub">GINCANA DE HALLOWEEN</div></div></div>
  <div class="top-actions"><button class="secondary small" onclick="exportData()">⬇ Backup</button><button class="secondary small" onclick="document.getElementById('restoreFile').click()">⬆ Restaurar</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreData(event)"><button class="danger small" onclick="resetAll()">Reiniciar</button></div>
</header>
<nav class="nav" id="nav">
<button data-page="home" class="active">⌂ Início</button><button data-page="people">👥 Participantes</button><button data-page="teams">🧩 Grupos e duplas</button><button data-page="play">🎮 Brincadeiras</button><button data-page="ranking">🏆 Ranking</button><button data-page="costume">🎭 Fantasias</button>
</nav>
<div id="view"></div>
<div class="footer">Feito para uma noite assustadoramente divertida • Os dados deste painel são salvos neste navegador.</div>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const STORAGE='halloweenGincanaV1';
const activities=[
{id:'quiz',name:'Perguntas e respostas',icon:'🧠',desc:'10 perguntas sobre o universo do terror • dois grupos',max:100},
{id:'images',name:'Qual é o filme ou personagem?',icon:'🖼️',desc:'10 rodadas com três imagens progressivas • duplas',max:150},
{id:'clues',name:'Jogo das três pistas',icon:'🔎',desc:'10 cartas de dedução • duelos individuais',max:150},
{id:'emoji',name:'Emoji do filme',icon:'😱',desc:'10 desafios de emojis • individual',max:100},
{id:'costume',name:'Concurso de fantasias',icon:'🎭',desc:'Nota única de 1 a 10 pelo QR Code',max:100}
];
const quiz=[
{q:'Qual é o nome do boneco assassino da franquia Brinquedo Assassino?',a:'Chucky',d:'Fácil',p:5},
{q:'Em O Iluminado, o que Danny usa para passear pelos corredores do hotel?',a:'Um triciclo',d:'Fácil',p:5},
{q:'Qual é o nome da entidade demoníaca associada à figura de uma freira em Invocação do Mal 2?',a:'Valak',d:'Média',p:10},
{q:'Em Pânico, qual é o nome da cidade fictícia onde acontecem os assassinatos dos primeiros filmes?',a:'Woodsboro',d:'Difícil',p:15},
{q:'Qual é o nome da menina possuída em O Exorcista?',a:'Regan MacNeil',d:'Fácil',p:5},
{q:'No filme Corra!, qual é o primeiro nome do protagonista?',a:'Chris',d:'Fácil',p:5},
{q:'Em A Hora do Pesadelo, onde Freddy Krueger ataca suas vítimas?',a:'Nos sonhos',d:'Fácil',p:5},
{q:'Qual é o nome do palhaço de It: A Coisa?',a:'Pennywise',d:'Fácil',p:5},
{q:'Em O Chamado, quantos dias a pessoa tem após assistir à fita para morrer?',a:'Sete dias',d:'Média',p:10},
{q:'Em A Bruxa, qual animal é conhecido como Black Phillip?',a:'Um bode',d:'Fácil',p:5}
];
const imageAnswers=['A Morte do Demônio — Evil Dead','Samara Morgan — O Chamado','Midsommar','Art, o Palhaço — Terrifier','O Babadook','Carrie White — Carrie, a Estranha','A Entidade — Sinister','Pinhead — Hellraiser','O Homem Invisível','Esther — A Órfã'];
const clues=[
['Hannibal Lecter — O Silêncio dos Inocentes',['Sou um personagem conhecido por uma inteligência excepcional e um comportamento perturbador.','Sou um psiquiatra que também é um assassino em série.','Fiquei famoso por usar uma máscara que cobre minha boca.']],
['Jigsaw — Jogos Mortais',['Acredito que as pessoas só valorizam a vida quando são colocadas à prova.','Crio armadilhas elaboradas para testar minhas vítimas.','Minha marca registrada é um boneco chamado Billy.']],
['Emily — A Noiva-Cadáver',['Minha história mistura romance, morte e fantasia sombria.','Fui abandonada no dia do meu casamento e acabei morta.','Sou a noiva de pele azul criada em um filme de Tim Burton.']],
['Seth Brundle — A Mosca',['Sou um cientista que trabalha com uma invenção revolucionária.','Um experimento científico altera meu corpo de forma terrível.','Acabo me transformando em uma criatura híbrida de humano e inseto.']],
['Cavaleiro Sem Cabeça',['Sou uma figura lendária associada a uma maldição.','Costumo aparecer montado em um cavalo durante a noite.','Sou um cavaleiro que perdeu a cabeça e aterroriza uma cidade.']],
['Xenomorfo — Alien',['Minha espécie é conhecida por um ciclo de reprodução aterrorizante.','Posso sair de dentro do corpo de um hospedeiro.','Sou a criatura extraterrestre com cabeça alongada e uma segunda mandíbula.']],
['Zumbis — A Noite dos Mortos-Vivos',['Minha presença costuma indicar o colapso da sociedade.','Em muitas histórias, sou atraído por carne humana.','Sou um morto que volta à vida e persegue os vivos.']],
['Jack Skellington — O Estranho Mundo de Jack',['Estou cansado de repetir a mesma celebração todos os anos.','Decido me aventurar em um feriado que não compreendo muito bem.','Sou o Rei das Abóboras de Halloween Town.']],
['A Bruxa de Blair — A Bruxa de Blair',['Minha história é apresentada como se fosse um registro encontrado.','Um grupo de estudantes desaparece durante uma investigação na floresta.','Sou a entidade lendária que dá nome ao filme de terror de 1999.']],
['Vampiro',['Em muitas histórias, só posso entrar em uma casa depois de ser convidado.','Posso ter aversão ao alho e à luz solar, dependendo da lenda.','Sou uma criatura que se alimenta de sangue e costuma ter presas.']]
];
const emojis=[
['🦈🌊🚤','Tubarão'],['🪓🚪🏨','O Iluminado'],['📞😱🔪','Pânico'],['🤡🎈🏚️','It: A Coisa'],['👧📼📺','O Chamado'],
['🧟‍♂️🏬🌆','Madrugada dos Mortos'],['🪞👹🩸','Candyman'],['🏕️🔪🌲','Sexta-Feira 13'],['🧑‍🚀👽🚀','Alien, o Oitavo Passageiro'],['🏠👨‍👩‍👧‍👦😈','Invocação do Mal']
];
const instructions={
quiz:['Dois grupos competem respondendo a dez perguntas sobre terror.','As perguntas valem 5, 10 ou 15 pontos conforme a dificuldade.','Leia a pergunta, revele o gabarito depois da resposta e clique no grupo que acertou.','Todos os integrantes do grupo recebem os pontos daquela pergunta.'],
images:['As duplas tentam descobrir um filme ou personagem por três imagens progressivamente mais fáceis.','Acerto na 1ª imagem: 15 pontos; na 2ª: 10; na 3ª: 5.','Carregue três imagens para cada rodada. Ao acertar, selecione a dupla vencedora.','No ranking individual, os pontos da dupla são divididos igualmente entre os integrantes.'],
clues:['Dois participantes se enfrentam por vez, usando as duplas da prova anterior como referência para os confrontos.','Leia uma pista por vez e peça que os dois registrem seus palpites.','Acerto na 1ª pista: 15 pontos; na 2ª: 10; na 3ª: 5. Se ambos acertarem na mesma pista, ambos pontuam.','Revele a resposta e avance para a próxima carta.'],
emoji:['Todos jogam individualmente. Mostre uma sequência de emojis que representa um filme.','Quem souber levanta a mão; autorize uma resposta por vez.','Cada acerto vale 10 pontos e cada rodada pode premiar apenas uma pessoa.','Se errar, permita que outra pessoa tente; depois revele a resposta.'],
costume:['Inscreva cada pessoa com o nome da fantasia e, se quiser, uma foto.','Mostre uma fantasia por vez no telão; os celulares acompanham automaticamente o slide atual.','Cada convidado escolhe uma única nota inteira de 1 a 10 para cada fantasia, sem votar na própria.','No fim, atualize as notas no painel. A média recebida × 10 vira pontos para o ranking.']
};
let state=load();
let page='home',activeActivity='quiz',round=0,revealed=false,clueStep=0,shownImage=0,answersRevealed=false,selectedClue=[null,null],selectedPeople=[],selectedGroup='g1',selectedPair=null,voteOpen=false;
function blankState(){return {people:[],groups:{g1:[],g2:[]},pairs:[],scores:{},activityScores:{},completed:{},roundLogs:[],roundData:{},votes:[],voteCode:'',started:false}}
function load(){try{return {...blankState(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){return blankState()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function person(id){return state.people.find(p=>p.id===id)}
function photo(p){return p?.photo||''}
function avatar(p,size=''){return p?.photo?`<img class="${size}" src="${p.photo}" alt="">`:`<div class="avatar ${size}">👻</div>`}
function total(id){return state.scores[id]||0}
function addScore(ids,points,label){ids=[...new Set(ids.filter(Boolean))];if(!ids.length){toast('Cadastre e selecione participantes primeiro.');return}ids.forEach(id=>{state.scores[id]=(state.scores[id]||0)+points;state.activityScores[id]=state.activityScores[id]||{};state.activityScores[id][activeActivity]=(state.activityScores[id][activeActivity]||0)+points});state.roundLogs.push({ids,points,label,activity:activeActivity,time:Date.now()});save();render();toast(`+${points} ponto(s) registrado(s)!`)}
function undoLast(){let log=state.roundLogs.pop();if(!log){toast('Não há lançamento para desfazer.');return}log.ids.forEach(id=>{state.scores[id]=Math.max(0,(state.scores[id]||0)-log.points);state.activityScores[id][log.activity]=Math.max(0,(state.activityScores[id]?.[log.activity]||0)-log.points)});save();render();toast('Último lançamento desfeito.')}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function render(){let v=document.getElementById('view');if(page==='home')v.innerHTML=home();else if(page==='people')v.innerHTML=peoplePage();else if(page==='teams')v.innerHTML=teamsPage();else if(page==='play')v.innerHTML=playPage();else if(page==='ranking')v.innerHTML=rankingPage();else if(page==='costume')v.innerHTML=costumePage();bindDynamic()}
function home(){let done=Object.values(state.completed).filter(Boolean).length;return `<section class="hero"><span class="pill">EDIÇÃO ESPECIAL • HALLOWEEN</span><h1>Uma noite. Cinco provas.<br><span class="accent">Um grande vencedor.</span></h1><p>Seu painel de controle para uma gincana assustadoramente divertida. Cadastre a galera, organize as equipes, some pontos ao vivo e acompanhe o ranking.</p></section><div class="stats"><div class="stat"><strong>${state.people.length}</strong><span>Participantes</span></div><div class="stat"><strong>${done}/5</strong><span>Provas concluídas</span></div><div class="stat"><strong>${state.people.length?total(ranking()[0]?.id):0}</strong><span>Maior pontuação atual</span></div></div><div class="main"><div class="section-head"><div><h2>Vamos começar?</h2><div class="muted">Siga esta ordem para deixar tudo pronto.</div></div><span class="pill">${state.started?'GINCANA EM ANDAMENTO':'PREPARAÇÃO'}</span></div><div class="grid2">${[['people','👥','1. Cadastrar participantes','Adicione nomes e fotos de até 20 pessoas.'],['teams','🧩','2. Organizar equipes','Monte os dois grupos e as duplas.'],['play','🎮','3. Iniciar as brincadeiras','Leia as instruções e controle os pontos.'],['ranking','🏆','4. Acompanhar o ranking','Veja a classificação atualizada.']].map(x=>`<div class="activity-card"><div class="activity-icon">${x[1]}</div><div class="grow"><h3>${x[2]}</h3><p>${x[3]}</p></div><button class="small" onclick="go('${x[0]}')">Abrir</button></div>`).join('')}</div><div style="margin-top:18px" class="notice">💾 O painel salva os dados neste navegador. Use o botão Backup no topo para guardar uma cópia extra.</div></div><div style="margin-top:18px" class="main"><h2>Ranking ao vivo</h2>${ranking().slice(0,5).map((p,i)=>rankRow(p,i)).join('')||'<p class="muted">Cadastre participantes para começar o ranking.</p>'}<button onclick="go('ranking')" class="secondary" style="margin-top:12px">Ver ranking completo →</button></div>`}
function peoplePage(){return `<div class="main"><div class="section-head"><div><h1>Participantes</h1><p class="muted">Cadastre todo mundo uma única vez. Você pode adicionar fotos para reconhecer as pessoas rapidamente.</p></div><span class="pill">${state.people.length}/20 cadastrados</span></div><form id="personForm" class="grid2"><div><label>Nome do participante</label><input id="personName" placeholder="Ex.: Ana" required maxlength="60"></div><div><label>Foto (opcional)</label><input id="personPhoto" type="file" accept="image/*"></div><div><button type="submit" ${state.people.length>=20?'disabled':''}>＋ Adicionar participante</button></div></form><hr style="border-color:var(--line);margin:22px 0"><div class="participant-grid">${state.people.map(p=>`<div class="person">${p.photo?`<img src="${p.photo}" alt="">`:`<div class="avatar">👻</div>`}<div class="name">${esc(p.name)}</div><div class="points">${total(p.id)} pontos</div><div class="person-actions"><button class="secondary small" onclick="editPerson('${p.id}')">Editar</button><button class="danger small" onclick="deletePerson('${p.id}')">Excluir</button></div></div>`).join('')||'<p class="muted">Nenhum participante cadastrado ainda.</p>'}</div></div>`}
function teamsPage(){return `<div class="main"><div class="section-head"><div><h1>Grupos e duplas</h1><p class="muted">Clique nas pessoas para selecioná-las e organizá-las antes das provas.</p></div></div><div class="notice">Os grupos são usados na prova de perguntas e respostas. As duplas serão usadas tanto na prova das imagens quanto nos duelos das três pistas.</div><h2 style="margin-top:22px">Grupos</h2><div class="grid2"><div class="card"><div class="section-head"><h3>🟣 Grupo 1 <span class="pill">${state.groups.g1.length}</span></h3><button class="small" onclick="selectGroup('g1')">Selecionar</button></div>${groupMembers('g1')}</div><div class="card"><div class="section-head"><h3>🟠 Grupo 2 <span class="pill">${state.groups.g2.length}</span></h3><button class="small" onclick="selectGroup('g2')">Selecionar</button></div>${groupMembers('g2')}</div></div><h2 style="margin-top:26px">Selecionar participantes para ${selectedGroup==='g1'?'Grupo 1':'Grupo 2'}</h2><p class="muted">Clique em cada foto para adicionar ou remover do grupo selecionado.</p><div class="participant-grid">${state.people.map(p=>`<div class="person ${state.groups[selectedGroup].includes(p.id)?'selected':''}" onclick="toggleGroup('${p.id}')">${p.photo?`<img src="${p.photo}" alt="">`:`<div class="avatar">👻</div>`}<div class="name">${esc(p.name)}</div><div class="tiny">${state.groups.g1.includes(p.id)?'Grupo 1':state.groups.g2.includes(p.id)?'Grupo 2':'Sem grupo'}</div></div>`).join('')||'<p class="muted">Cadastre participantes primeiro.</p>'}</div><hr style="border-color:var(--line);margin:26px 0"><div class="section-head"><div><h2>Duplas</h2><p class="muted">Selecione duas pessoas por vez para formar uma dupla.</p></div><button onclick="makePair()" ${selectedPeople.length!==2?'disabled':''}>Criar dupla (${selectedPeople.length}/2)</button></div><div class="participant-grid">${state.people.map(p=>`<div class="person ${selectedPeople.includes(p.id)?'selected':''}" onclick="togglePairPerson('${p.id}')">${p.photo?`<img src="${p.photo}" alt="">`:`<div class="avatar">👻</div>`}<div class="name">${esc(p.name)}</div><div class="tiny">${state.pairs.some(pair=>pair.includes(p.id))?'Já tem dupla':'Disponível'}</div></div>`).join('')}</div><h3 style="margin-top:20px">Duplas montadas</h3><div class="grid2">${state.pairs.map((pair,i)=>`<div class="score-team"><strong>Dupla ${i+1}</strong><div class="members">${pair.map(id=>`<span class="pill">${esc(person(id)?.name||'Removido')}</span>`).join('')}</div><button class="danger small" style="margin-top:10px" onclick="removePair(${i})">Desfazer dupla</button></div>`).join('')||'<p class="muted">Ainda não há duplas.</p>'}</div>${state.people.length%2?'':' '}<div class="notice warning" style="margin-top:18px">Se houver número ímpar de participantes, deixe uma pessoa sem dupla ou combine uma exceção antes de iniciar.</div></div>`}
function groupMembers(g){return `<div class="members">${state.groups[g].map(id=>`<span class="pill">${esc(person(id)?.name||'')}</span>`).join('')||'<span class="muted tiny">Nenhum integrante selecionado</span>'}</div>`}
function selectGroup(g){selectedGroup=g;selectedPeople=[];render()}
function toggleGroup(id){let other=selectedGroup==='g1'?'g2':'g1';if(state.groups[selectedGroup].includes(id))state.groups[selectedGroup]=state.groups[selectedGroup].filter(x=>x!==id);else{state.groups[other]=state.groups[other].filter(x=>x!==id);state.groups[selectedGroup].push(id)}save();render()}
function togglePairPerson(id){if(state.pairs.some(p=>p.includes(id))&&!selectedPeople.includes(id)){toast('Essa pessoa já tem dupla. Desfaça a dupla primeiro.');return}if(selectedPeople.includes(id))selectedPeople=selectedPeople.filter(x=>x!==id);else if(selectedPeople.length<2)selectedPeople.push(id);else toast('Selecione somente duas pessoas.');render()}
function makePair(){if(selectedPeople.length!==2)return;state.pairs.push([...selectedPeople]);selectedPeople=[];save();render();toast('Dupla criada!')}
function removePair(i){state.pairs.splice(i,1);save();render()}
function ranking(){return [...state.people].sort((a,b)=>total(b.id)-total(a.id)||((state.activityScores[b.id]?.clues||0)-(state.activityScores[a.id]?.clues||0))||((state.activityScores[b.id]?.images||0)-(state.activityScores[a.id]?.images||0))||a.name.localeCompare(b.name))}
function rankRow(p,i){let breakdown=activities.map(a=>`${a.name}: ${state.activityScores[p.id]?.[a.id]||0}`).join(' • ');return `<div class="ranking-row"><div class="ranknum">${i===0&&total(p.id)>0?'👑':i+1}</div>${p.photo?`<img class="rankimg" src="${p.photo}" alt="">`:'<div class="rankimg" style="display:grid;place-items:center">👻</div>'}<div><div class="rankname">${esc(p.name)}</div><div class="rankdetail">${breakdown}</div></div><div class="rankpoints">${total(p.id)}</div></div>`}
function rankingPage(){return `<div class="main"><div class="section-head"><div><h1>🏆 Ranking geral</h1><p class="muted">A classificação é atualizada automaticamente conforme os pontos são registrados.</p></div><button class="secondary" onclick="exportData()">Exportar backup</button></div><div class="notice">Desempate: maior pontuação em “Jogo das três pistas”; depois, “Qual é o filme ou personagem?”. Se continuar empatado, faça uma pergunta extra de desempate.</div><div style="margin-top:18px">${ranking().map(rankRow).join('')||'<p class="muted">Cadastre participantes para ver a classificação.</p>'}</div></div>`}
function playPage(){let a=activities.find(x=>x.id===activeActivity);return `<div class="layout"><div class="main"><div class="section-head"><div><span class="pill">CENTRAL DE JOGO</span><h1 style="margin-top:10px">${a.icon} ${a.name}</h1><p class="muted">${a.desc}</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="secondary" onclick="toggleGameFullscreen()">⛶ Tela cheia da brincadeira</button><span class="pill">${state.completed[activeActivity]?'CONCLUÍDA':'EM PREPARAÇÃO'}</span></div></div><div class="grid2" style="margin-bottom:20px">${activities.map(x=>`<button class="${x.id===activeActivity?'':'secondary'}" onclick="setActivity('${x.id}')">${x.icon} ${x.name}</button>`).join('')}</div><div class="instruction"><h2>📜 Como funciona</h2><ol>${instructions[activeActivity].map(s=>`<li>${s}</li>`).join('')}</ol><button onclick="startActivity()">Começar / continuar prova →</button></div><div id="roundArea" class="round-area" style="margin-top:18px">${state.started&&state.roundData[activeActivity]?.started?renderRound():`<div class="notice" style="margin-top:18px">Quando estiver pronta, clique em “Começar / continuar prova”. As regras ficam disponíveis acima durante toda a brincadeira.</div>`}</div></div><aside class="side"><div class="section-head"><div><h2>Placar ao vivo</h2><div class="tiny">Clique para atribuir os pontos da rodada.</div></div><button class="secondary small" onclick="undoLast()">↶ Desfazer</button></div>${scoreSide()}<button class="secondary" style="width:100%;margin-top:14px" onclick="go('ranking')">🏆 Ver ranking completo</button><button class="orange" style="width:100%;margin-top:8px" onclick="finishActivity()">Finalizar esta prova</button></aside></div>`}
function scoreSide(){if(activeActivity==='quiz')return `<div class="scoreboard">${['g1','g2'].map(g=>`<div class="score-team"><strong>${g==='g1'?'🟣 Grupo 1':'🟠 Grupo 2'}</strong><span class="bigscore">${state.groups[g].reduce((s,id)=>s+total(id),0)}</span><div class="members">${state.groups[g].map(id=>`<span class="pill">${esc(person(id)?.name||'')}</span>`).join('')||'<span class="tiny">Selecione integrantes em Grupos e duplas.</span>'}</div><div class="score-buttons"><button class="small" onclick="scoreCurrent('${g}')">＋ Pontuar grupo</button></div></div>`).join('')}</div>`;
if(activeActivity==='images')return `<div class="scoreboard">${state.pairs.map((pair,i)=>`<div class="score-team"><strong>Dupla ${i+1}</strong><span class="bigscore">${pair.reduce((s,id)=>s+total(id),0)}</span><div class="members">${pair.map(id=>`<span class="pill">${esc(person(id)?.name||'')}</span>`).join('')}</div><div class="score-buttons">${[15,10,5].map(n=>`<button class="small" onclick="scorePair(${i},${n})">+${n}</button>`).join('')}</div></div>`).join('')||'<p class="tiny">Monte as duplas antes da prova.</p>'}</div>`;
return `<div class="scoreboard">${ranking().map(p=>`<div class="score-team"><div style="display:flex;align-items:center;gap:8px">${p.photo?`<img class="mini-avatar" src="${p.photo}">`:'👻'}<strong>${esc(p.name)}</strong><span class="bigscore">${total(p.id)}</span></div><div class="score-buttons">${(activeActivity==='clues'?[15,10,5]:activeActivity==='emoji'?[10]:[5,10,15]).map(n=>`<button class="small" onclick="addScore(['${p.id}'],${n},'Lançamento manual')">+${n}</button>`).join('')}</div></div>`).join('')||'<p class="tiny">Cadastre participantes para começar.</p>'}</div>`}
function setActivity(id){activeActivity=id;round=0;revealed=false;clueStep=0;shownImage=0;answersRevealed=false;selectedClue=[null,null];render()}
function toggleGameFullscreen(){const el=document.querySelector('.layout .main');if(!el){toast('Abra a área Brincadeiras primeiro.');return}if(document.fullscreenElement){document.exitFullscreen?.();return}if(!el.requestFullscreen){toast('A tela cheia não é compatível com este navegador.');return}el.requestFullscreen().catch(()=>toast('Não foi possível ativar a tela cheia. Abra o site publicado em HTTPS e tente novamente.'))}
function startActivity(){state.started=true;state.roundData[activeActivity]=state.roundData[activeActivity]||{started:true,round:0};state.roundData[activeActivity].started=true;save();render()}
function renderRound(){let d=state.roundData[activeActivity]||{round:0};round=d.round||0;let idx=round;let body='';
if(activeActivity==='quiz'){let q=quiz[idx];body=q?`<div class="roundbar"><span class="pill">Pergunta ${idx+1} de ${quiz.length}</span><span class="pill">${q.d} • ${q.p} pontos</span></div><div class="question">${q.q}</div>${revealed?`<div class="answer"><strong>Resposta:</strong> ${q.a}</div>`:''}<div class="score-buttons"><button onclick="revealed=true;render()">Revelar resposta</button><button class="secondary" onclick="skipRound()">Ninguém acertou / avançar</button><button class="secondary" onclick="nextRound()" ${!revealed?'disabled':''}>Próxima pergunta →</button></div><div class="notice" style="margin-top:12px">Depois de revelar a resposta, clique em “Pontuar grupo” no painel lateral. Cada integrante recebe ${q.p} pontos.</div>`:doneMessage();}
if(activeActivity==='images'){let ans=imageAnswers[idx],imgs=(state.roundData.imagesList||[])[idx]||[];body=ans?`<div class="roundbar"><span class="pill">Rodada ${idx+1} de 10</span><span class="pill">15 / 10 / 5 pontos</span></div><div class="question">Qual é o filme ou personagem?</div><div class="grid3">${[0,1,2].map(i=>`<div class="card"><label>Imagem ${i+1}</label>${imgs[i]?`<img style="width:100%;max-height:180px;object-fit:contain;border-radius:10px" src="${imgs[i]}">`:'<div class="instruction" style="text-align:center">🖼️<p class="tiny">Imagem não adicionada</p>'}<input type="file" accept="image/*" onchange="uploadRoundImage(${idx},${i},event)"></div>`).join('')}</div><div class="answer ${answersRevealed?'':'hidden'}"><strong>Resposta:</strong> ${ans}</div><div class="score-buttons"><button onclick="shownImage=Math.min(2,shownImage+1);render()">Revelar próxima imagem (${shownImage+1}/3)</button><button class="secondary" onclick="answersRevealed=true;render()">Revelar resposta</button><button class="secondary" onclick="skipRound()">Ninguém acertou / avançar</button><button class="secondary" onclick="nextRound()">Próxima rodada →</button></div><p class="tiny">Depois do acerto, clique em +15, +10 ou +5 na dupla vencedora. Os pontos serão divididos automaticamente entre os dois integrantes.</p>`:doneMessage()}
if(activeActivity==='clues'){let c=clues[idx];body=c?`<div class="roundbar"><span class="pill">Carta ${idx+1} de 10</span><span class="pill">15 / 10 / 5 pontos</span></div><div class="question">Quem sou eu?</div><div class="instruction"><strong>Pista ${clueStep+1}:</strong><p style="margin:10px 0 0">${c[1][clueStep]}</p></div><div class="grid2" style="margin-top:12px">${[0,1].map(i=>`<div class="score-team"><strong>${i===0?'Participante A':'Participante B'}</strong><select id="cluePerson${i}"><option value="">Selecione participante</option>${state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="small" style="margin-top:8px" onclick="awardClue(${i})">Acertou nesta pista (+${[15,10,5][clueStep]})</button></div>`).join('')}</div>${revealed?`<div class="answer"><strong>Resposta:</strong> ${c[0]}</div>`:''}<div class="score-buttons"><button onclick="nextClue()" ${clueStep>=2?'disabled':''}>Próxima pista →</button><button class="secondary" onclick="revealed=true;render()">Revelar resposta</button><button class="secondary" onclick="skipRound()">Ninguém acertou / próxima carta</button><button class="secondary" onclick="nextRound()">Próxima carta →</button></div>`:doneMessage()}
if(activeActivity==='emoji'){let e=emojis[idx];body=e?`<div class="roundbar"><span class="pill">Desafio ${idx+1} de 10</span><span class="pill">10 pontos</span></div><div class="question" style="text-align:center">Que filme é este?</div><div class="emoji-question">${e[0]}</div>${revealed?`<div class="answer"><strong>Resposta:</strong> ${e[1]}</div>`:''}<div class="fieldrow"><div><label>Quem acertou?</label><select id="emojiWinner"><option value="">Selecione participante</option>${state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button onclick="awardEmoji()">＋ Registrar acerto (10 pontos)</button></div><div class="score-buttons"><button class="secondary" onclick="revealed=true;render()">Revelar resposta</button><button class="secondary" onclick="skipRound()">Ninguém acertou / avançar</button><button class="secondary" onclick="nextRound()">Próximo emoji →</button></div>`:doneMessage()}
if(activeActivity==='costume')body=`<div class="question">Desfile de fantasias</div><div class="instruction"><p>Inscreva as pessoas com o nome da fantasia, gere o QR Code e apresente uma pessoa por vez. Os celulares mostram automaticamente a fantasia atual.</p><p>Cada convidado dá uma nota única de 1 a 10. A média recebida multiplicada por 10 vira pontos no ranking.</p></div><button style="margin-top:14px" onclick="go('costume')">Abrir desfile e votação por QR Code →</button>`;
return body}
function doneMessage(){return `<div class="instruction"><h2>🎉 Rodadas concluídas!</h2><p>Você chegou ao fim das rodadas desta brincadeira. Confira o ranking e finalize a prova.</p><button onclick="finishActivity()">Concluir brincadeira</button></div>`}
function scoreCurrent(g){let q=quiz[round];if(activeActivity!=='quiz'||!q){toast('Nenhuma pergunta ativa.');return}if(!revealed){toast('Revele a resposta antes de pontuar.');return}addScore(state.groups[g],q.p,`Pergunta ${round+1} • Grupo ${g}`)}
function scorePair(i,n){let pair=state.pairs[i];if(!pair)return;let half=n/2;pair.forEach(id=>{state.scores[id]=(state.scores[id]||0)+half;state.activityScores[id]=state.activityScores[id]||{};state.activityScores[id].images=(state.activityScores[id].images||0)+half});state.roundLogs.push({ids:[...pair],points:half,label:`Rodada de imagem ${round+1} • Dupla ${i+1}`,activity:'images',time:Date.now()});save();render();toast(`Dupla pontuou ${n} pontos (${half} para cada integrante).`)}
function nextRound(){let max=activeActivity==='quiz'?quiz.length:activeActivity==='images'?imageAnswers.length:activeActivity==='clues'?clues.length:activeActivity==='emoji'?emojis.length:1;round=(state.roundData[activeActivity]?.round||0)+1;state.roundData[activeActivity].round=round;revealed=false;answersRevealed=false;shownImage=0;clueStep=0;selectedClue=[null,null];save();render()}
function skipRound(){nextRound()}
function nextClue(){if(clueStep<2){clueStep++;render()}}
function awardClue(i){let sel=document.getElementById('cluePerson'+i)?.value;if(!sel){toast('Selecione quem acertou.');return}let pts=[15,10,5][clueStep];addScore([sel],pts,`Três pistas • carta ${round+1} • pista ${clueStep+1}`);revealed=true;render()}
function awardEmoji(){let id=document.getElementById('emojiWinner')?.value;if(!id){toast('Selecione quem acertou.');return}if(!revealed){toast('Revele a resposta antes de registrar o acerto.');return}addScore([id],10,`Emoji ${round+1}`)}
function finishActivity(){if(!confirm('Deseja marcar esta brincadeira como concluída? Você poderá continuar editando as pontuações.'))return;state.completed[activeActivity]=true;save();go('ranking');toast('Prova concluída. Ranking atualizado!')}
function uploadRoundImage(r,i,e){let f=e.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{state.roundData.imagesList=state.roundData.imagesList||[];state.roundData.imagesList[r]=state.roundData.imagesList[r]||[];state.roundData.imagesList[r][i]=reader.result;save();render()};reader.readAsDataURL(f)}
function costumePage(){
const cfg=getCloudConfig();
const contestants=state.people.filter(p=>(p.costumeName||'').trim());
const idx=Math.max(0,Math.min(state.costumeSlideIndex||0,Math.max(0,contestants.length-1)));
const current=contestants[idx];
const personOptions=state.people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
return `<div class="main"><div class="section-head"><div><h1>🎭 Desfile de fantasias</h1><p class="muted">Cadastre quem vai participar, apresente uma fantasia por vez no telão e deixe o público votar pelo celular.</p></div><span class="pill">${contestants.length} fantasia(s) inscrita(s)</span></div>
<div class="grid2"><div class="card"><h2>➕ Inscrever participante</h2><p class="muted">Você pode cadastrar uma pessoa nova ou associar a fantasia a alguém já cadastrado na gincana.</p>
<form id="costumeForm"><label>Participante já cadastrado (opcional)</label><select id="costumePerson"><option value="">Cadastrar uma pessoa nova</option>${personOptions}</select>
<div id="newCostumeNameWrap"><label style="margin-top:10px">Nome da pessoa</label><input id="newCostumePersonName" maxlength="60" placeholder="Ex.: Ana"></div>
<label style="margin-top:10px">Nome da fantasia / personagem</label><input id="costumeName" maxlength="100" required placeholder="Ex.: A Noiva Cadáver">
<div id="newCostumePhotoWrap"><label style="margin-top:10px">Foto da pessoa (opcional)</label><input id="costumePhoto" type="file" accept="image/*"></div>
<button type="submit" style="margin-top:14px">＋ Salvar inscrição</button></form></div>
<div class="card"><h2>📱 Votação por QR Code</h2><p class="muted">Configure o banco online uma vez. Os celulares verão automaticamente a pessoa e o nome da fantasia que estiverem no telão.</p>
<div class="notice ${cfg.url&&cfg.key?'success':'warning'}">${cfg.url&&cfg.key?'Conexão configurada neste computador.':'Para sincronizar telão e celulares, configure o Supabase abaixo.'}</div>
<label style="margin-top:12px">Supabase Project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url||'')}">
<label style="margin-top:10px">Chave pública anon/public</label><input id="sbKey" placeholder="Cole a chave pública do projeto" value="${esc(cfg.key||'')}">
<label style="margin-top:10px">Código desta festa</label><input id="sbEvent" value="${esc(cfg.event||'halloween2026')}" placeholder="halloween2026">
<button onclick="saveCloudConfig()" style="margin-top:12px">Salvar configuração</button><button class="secondary" onclick="publishVoting()" style="margin-top:8px;width:100%">☁️ Publicar inscritos e gerar QR Code</button><div id="cloudStatus" class="notice" style="margin-top:12px">${cfg.url&&cfg.key?'Pronto para publicar a lista de fantasias.':'Preencha a URL e a chave pública do Supabase.'}</div><div id="qrArea" style="margin-top:12px"></div></div></div>
<div class="card" style="margin-top:16px"><div class="section-head"><div><h2>🎬 Apresentação no telão</h2><p class="muted">A pessoa selecionada aparece no computador e no celular dos convidados. Use Próxima fantasia para avançar os slides.</p></div><span class="pill">${current?`${idx+1} de ${contestants.length}`:'Sem inscrições'}</span></div>
${current?`<div class="costume-slide" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:center;background:linear-gradient(135deg,#32154a,#170f21);border:1px solid #69428a;border-radius:20px;padding:clamp(16px,4vw,34px);min-height:280px"><div style="text-align:center">${current.photo?`<img src="${current.photo}" alt="${esc(current.name)}" style="width:min(100%,260px);aspect-ratio:3/4;object-fit:cover;border-radius:18px;border:3px solid #ff8a24;box-shadow:0 12px 35px #0006">`:'<div style="font-size:130px">👻</div>'}</div><div><div class="pill">NOITE DO TERROR • DESFILE</div><h1 style="font-size:clamp(28px,5vw,54px);margin-top:18px">${esc(current.name)}</h1><p style="font-size:clamp(20px,3vw,34px);font-weight:900;color:var(--orange);overflow-wrap:anywhere">${esc(current.costumeName)}</p></div></div>
<div class="fieldrow" style="margin-top:14px"><button class="secondary" onclick="changeCostumeSlide(-1)" ${idx===0?'disabled':''}>← Anterior</button><button onclick="setCostumeSlide()">Mostrar no telão / sincronizar</button><button class="secondary" onclick="toggleCostumeFullscreen()">⛶ Tela cheia</button><button class="orange" onclick="changeCostumeSlide(1)" ${idx>=contestants.length-1?'disabled':''}>Próxima fantasia →</button></div><p class="tiny" style="margin-top:10px">A mudança do slide é enviada ao banco online para atualizar os celulares automaticamente.</p>`:'<div class="notice warning">Inscreva pelo menos uma fantasia para começar a apresentação.</div>'}</div>
<div class="card" style="margin-top:16px"><h2>📋 Lista de inscritos</h2><div class="participant-grid">${contestants.map((p,i)=>`<div class="person ${current&&p.id===current.id?'selected':''}">${p.photo?`<img src="${p.photo}" alt="">`:'<div class="avatar">🎭</div>'}<div class="name">${esc(p.name)}</div><div class="points">${esc(p.costumeName)}</div><div class="person-actions"><button class="secondary small" onclick="chooseCostumeSlide(${i})">Exibir no telão</button><button class="danger small" onclick="removeCostume('${p.id}')">Remover inscrição</button></div></div>`).join('')||'<p class="muted">Nenhuma fantasia inscrita ainda.</p>'}</div></div>
<div class="card" style="margin-top:16px"><div class="section-head"><div><h2>🏆 Resultado da votação</h2><p class="muted">Cada fantasia recebe uma nota única de 1 a 10. A média das notas × 10 vira a pontuação da prova.</p></div><button onclick="refreshRemoteVotes()">🔄 Atualizar notas e ranking</button></div><div id="costumeResults">${costumeResults()}</div></div></div>`}
function toggleCostumePerson(){const sel=document.getElementById('costumePerson');if(!sel)return;const isNew=!sel.value;document.getElementById('newCostumeNameWrap').classList.toggle('hidden',!isNew);document.getElementById('newCostumePhotoWrap').classList.toggle('hidden',!isNew);document.getElementById('newCostumePersonName').required=isNew}
function saveCostumeEntry(e){e.preventDefault();const selected=document.getElementById('costumePerson').value;const costumeName=document.getElementById('costumeName').value.trim();if(!costumeName){toast('Informe o nome da fantasia.');return}if(selected){const p=person(selected);if(!p)return;p.costumeName=costumeName;save();render();toast('Fantasia inscrita!');return}const name=document.getElementById('newCostumePersonName').value.trim();if(!name){toast('Informe o nome da pessoa.');return}if(state.people.length>=20){toast('Limite de 20 participantes.');return}const file=document.getElementById('costumePhoto').files[0];const add=async()=>{let photo='';if(file)photo=await readImage(file);state.people.push({id:'p'+Date.now()+Math.random().toString(16).slice(2,6),name,photo,costumeName});save();render();toast('Participante e fantasia inscritos!')};add()}
function removeCostume(id){const p=person(id);if(!p)return;if(!confirm(`Remover a inscrição de fantasia de ${p.name}? A pessoa continuará cadastrada na gincana.`))return;p.costumeName='';save();render()}
function costumeContestants(){return state.people.filter(p=>(p.costumeName||'').trim())}
function toggleCostumeFullscreen(){const el=document.querySelector('.costume-slide');if(!el){toast('Inscreva uma fantasia primeiro.');return}if(document.fullscreenElement){document.exitFullscreen?.()}else{el.requestFullscreen?.().catch(()=>toast('Não foi possível ativar a tela cheia neste navegador.'))}}
function chooseCostumeSlide(i){state.costumeSlideIndex=i;save();render();setCostumeSlide()}
function changeCostumeSlide(delta){const list=costumeContestants();state.costumeSlideIndex=Math.max(0,Math.min(list.length-1,(state.costumeSlideIndex||0)+delta));save();render();setCostumeSlide()}
async function setCostumeSlide(){const list=costumeContestants();if(!list.length)return;const idx=Math.max(0,Math.min(state.costumeSlideIndex||0,list.length-1));const p=list[idx];const c=getCloudConfig();if(!c.url||!c.key){toast('Slide local atualizado. Configure o Supabase para sincronizar os celulares.');return}try{await cloudRequest('halloween_costume_stage?on_conflict=event_code','POST',{event_code:c.event,current_participant_id:p.id,updated_at:new Date().toISOString()},'resolution=merge-duplicates,return=minimal');const st=document.getElementById('cloudStatus');if(st)st.textContent=`Telão sincronizado: ${p.name} — ${p.costumeName}`;toast(`Agora no telão: ${p.costumeName}`)}catch(e){const st=document.getElementById('cloudStatus');if(st)st.textContent='Não foi possível sincronizar o slide: '+e.message}}
function getCloudConfig(){try{return JSON.parse(localStorage.getItem('halloweenCloudConfig')||'{}')}catch(e){return {}}}
function saveCloudConfig(){let url=document.getElementById('sbUrl')?.value.trim().replace(/\/$/,''),key=document.getElementById('sbKey')?.value.trim(),event=(document.getElementById('sbEvent')?.value.trim()||'halloween2026').replace(/[^a-zA-Z0-9_-]/g,'');if(!url||!/^https:\/\/[\w.-]+\.supabase\.co$/i.test(url)||!key||!event){toast('Confira URL, chave pública e código da festa.');return}localStorage.setItem('halloweenCloudConfig',JSON.stringify({url,key,event}));toast('Configuração online salva neste computador.');render()}
async function cloudRequest(path,method='GET',body=null,prefer=''){let c=getCloudConfig();if(!c.url||!c.key)throw Error('Salve primeiro a configuração do Supabase.');let headers={'apikey':c.key,'Authorization':'Bearer '+c.key,'Content-Type':'application/json'};if(prefer)headers['Prefer']=prefer;let res=await fetch(c.url+'/rest/v1/'+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});let txt=await res.text();if(!res.ok)throw Error('Supabase '+res.status+': '+txt.slice(0,300));return txt?JSON.parse(txt):null}
async function publishVoting(){let c=getCloudConfig();if(!c.url||!c.key){toast('Salve a configuração do Supabase primeiro.');return}const contestants=costumeContestants();if(!contestants.length){toast('Inscreva pelo menos uma fantasia antes de publicar.');return}let status=document.getElementById('cloudStatus'),qr=document.getElementById('qrArea');if(status)status.textContent='Enviando participantes e fantasias ao banco online…';try{let records=contestants.map(p=>({event_code:c.event,participant_id:p.id,name:p.name,costume_name:p.costumeName||'',photo:p.photo||''}));await cloudRequest('halloween_participants?on_conflict=event_code,participant_id','POST',records,'resolution=merge-duplicates,return=minimal');const list=costumeContestants();const p=list[Math.max(0,Math.min(state.costumeSlideIndex||0,list.length-1))];if(p)await cloudRequest('halloween_costume_stage?on_conflict=event_code','POST',{event_code:c.event,current_participant_id:p.id,updated_at:new Date().toISOString()},'resolution=merge-duplicates,return=minimal');let voteUrl=new URL('votacao.html',location.href);voteUrl.searchParams.set('evento',c.event);voteUrl.searchParams.set('url',c.url);voteUrl.searchParams.set('key',c.key);let u=voteUrl.href;if(qr)qr.innerHTML=`<div class="success notice"><strong>Fantasia(s) publicada(s)!</strong> Os convidados vão ver no celular a pessoa e a fantasia que estiverem no telão.</div><img alt="QR Code da votação" style="width:220px;height:220px;background:white;padding:8px;border-radius:10px" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(u)}"><p class="tiny" style="overflow-wrap:anywhere">${esc(u)}</p><button onclick="window.open('${u.replace(/'/g,'%27')}','_blank')">Testar votação</button><button class="secondary" onclick="copyVoteLink()">Copiar link</button>`;localStorage.setItem('halloweenVoteUrl',u);if(status)status.textContent='Lista publicada. Use os botões de apresentação para trocar a fantasia ativa no telão e nos celulares.';toast('Lista publicada e QR Code gerado!')}catch(e){if(status)status.textContent='Não foi possível publicar: '+e.message+' Confira se executou a versão atualizada do SQL.';}}
function copyVoteLink(){let u=localStorage.getItem('halloweenVoteUrl')||'';if(!u)return;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(u).then(()=>toast('Link copiado!')).catch(()=>prompt('Copie o link:',u));else prompt('Copie o link:',u)}
async function refreshRemoteVotes(){let c=getCloudConfig(),status=document.getElementById('cloudStatus');if(status)status.textContent='Buscando notas recebidas…';try{let ratings=await cloudRequest('halloween_costume_ratings?event_code=eq.'+encodeURIComponent(c.event)+'&select=participant_id,rating,created_at');let sums={};for(let p of costumeContestants())sums[p.id]={sum:0,n:0};for(let r of (ratings||[])){if(!sums[r.participant_id])continue;sums[r.participant_id].sum+=Number(r.rating);sums[r.participant_id].n++}let results=[];for(let p of costumeContestants()){let x=sums[p.id];if(x.n){let avg=x.sum/x.n;results.push({id:p.id,avg,points:Math.round(avg*10),votes:x.n})}}if(!results.length)throw Error('Ainda não há notas válidas recebidas.');if(!confirm(`Foram encontradas ${ratings.length} notas. Atualizar os pontos do concurso e substituir a pontuação anterior desta prova?`))return;state.costumeResults=results;for(let p of state.people){let old=state.activityScores[p.id]?.costume||0;let r=results.find(x=>x.id===p.id);state.scores[p.id]=(state.scores[p.id]||0)-old+(r?.points||0);state.activityScores[p.id]=state.activityScores[p.id]||{};state.activityScores[p.id].costume=r?.points||0}state.completed.costume=true;save();render();toast('Notas sincronizadas e ranking atualizado!')}catch(e){if(status)status.textContent='Erro ao buscar notas: '+e.message;}}
function costumeResults(){if(!state.costumeResults?.length)return '<p class="muted">Ainda não há resultados importados. Clique em “Atualizar notas e ranking” após a votação.</p>';return `<div class="card"><h2>Resultado do concurso</h2>${state.costumeResults.slice().sort((a,b)=>b.points-a.points).map((r,i)=>`<div class="ranking-row"><div class="ranknum">${i+1}</div><div class="rankimg" style="display:grid;place-items:center">🎭</div><div><div class="rankname">${esc(person(r.id)?.name||'')}</div><div class="rankdetail">Fantasia: ${esc(person(r.id)?.costumeName||'')} • Média ${r.avg.toFixed(2)} / 10 • ${r.votes} voto(s)</div></div><div class="rankpoints">${r.points}</div></div>`).join('')}</div>`}
function calculateCostume(){let res=[];for(let p of state.people){let c=document.getElementById('creative_'+p.id),s=document.getElementById('scary_'+p.id);if(!c||!s)continue;let cv=c.value===''?null:Number(c.value),sv=s.value===''?null:Number(s.value);if(cv===null||sv===null)continue;if(cv<0||cv>10||sv<0||sv>10){toast('As notas precisam ficar entre 0 e 10.');return}let avg=(cv+sv)/2;res.push({id:p.id,creative:cv,scary:sv,avg,points:Math.round(avg*10)})}if(!res.length){toast('Preencha as notas antes de calcular.');return}if(!confirm('Isso lançará os pontos do concurso de fantasias no ranking. Se já lançou antes, evite duplicar. Continuar?'))return;state.costumeResults=res;state.costumeResults.forEach(r=>{let old=state.activityScores[r.id]?.costume||0;state.scores[r.id]=(state.scores[r.id]||0)-old+r.points;state.activityScores[r.id]=state.activityScores[r.id]||{};state.activityScores[r.id].costume=r.points});state.completed.costume=true;save();render();toast('Resultado das fantasias atualizado!')}
function makeQR(){let url=document.getElementById('voteUrl')?.value.trim();let area=document.getElementById('qrArea');if(!url||!/^https?:\/\//i.test(url)){area.innerHTML='<p class="tiny">Insira um endereço público começando com https:// para gerar o QR Code.</p>';return}area.innerHTML=`<img alt="QR Code para votação" style="width:180px;height:180px;background:white;padding:8px;border-radius:10px" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}"><p style="font-size:12px;color:#6c5b76;overflow-wrap:anywhere">${esc(url)}</p><button onclick="window.open('${url.replace(/'/g,'%27')}','_blank')">Testar endereço</button>`}
function bindDynamic(){let cf=document.getElementById('costumeForm');if(cf){cf.onsubmit=saveCostumeEntry;document.getElementById('costumePerson').onchange=toggleCostumePerson;toggleCostumePerson()}let f=document.getElementById('personForm');if(f)f.onsubmit=async e=>{e.preventDefault();if(state.people.length>=20){toast('Limite de 20 participantes.');return}let name=document.getElementById('personName').value.trim();if(!name)return;let file=document.getElementById('personPhoto').files[0];let photo='';if(file)photo=await readImage(file);state.people.push({id:'p'+Date.now()+Math.random().toString(16).slice(2,6),name,photo});save();render();toast('Participante cadastrado!')}}
function readImage(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let canvas=document.createElement('canvas'),max=350,scale=Math.min(1,max/Math.max(im.width,im.height));canvas.width=im.width*scale;canvas.height=im.height*scale;canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};im.onerror=()=>resolve(r.result);im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function editPerson(id){let p=person(id);if(!p)return;modal(`<h2>Editar participante</h2><label>Nome</label><input id="editName" value="${esc(p.name)}"><label style="margin-top:10px">Nome da fantasia (opcional)</label><input id="editCostumeName" value="${esc(p.costumeName||'')}" placeholder="Ex.: A Noiva Cadáver"><label style="margin-top:10px">Trocar foto (opcional)</label><input id="editPhoto" type="file" accept="image/*"><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button onclick="savePersonEdit('${id}')">Salvar</button></div>`)}
async function savePersonEdit(id){let p=person(id);if(!p)return;let name=document.getElementById('editName').value.trim(),f=document.getElementById('editPhoto').files[0];if(!name){toast('Informe um nome.');return}p.name=name;p.costumeName=document.getElementById('editCostumeName')?.value.trim()||'';if(f)p.photo=await readImage(f);save();closeModal();render()}
function deletePerson(id){let p=person(id);if(!p||!confirm(`Excluir ${p.name}? Isso também remove a pessoa dos grupos e duplas.`))return;state.people=state.people.filter(x=>x.id!==id);state.groups.g1=state.groups.g1.filter(x=>x!==id);state.groups.g2=state.groups.g2.filter(x=>x!==id);state.pairs=state.pairs.filter(pair=>!pair.includes(id));delete state.scores[id];delete state.activityScores[id];save();render()}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-gincana-halloween.json';a.click();URL.revokeObjectURL(url);toast('Backup preparado para download.')}
function restoreData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.people)||!d.scores)throw Error();if(!confirm('Restaurar este backup e substituir os dados atuais?'))return;state={...blankState(),...d};save();render();toast('Backup restaurado!')}catch(err){toast('Arquivo de backup inválido.')}};r.readAsText(f);e.target.value=''}
function resetAll(){if(!confirm('Tem certeza que deseja apagar os participantes, pontuações e progresso desta gincana?'))return;if(!confirm('Última confirmação: essa ação não pode ser desfeita sem um backup.'))return;state=blankState();page='home';activeActivity='quiz';round=0;save();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='home'));render();toast('Gincana reiniciada.')}
render();
</script>
</body>
</html>
